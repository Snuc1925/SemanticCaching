name: semcache

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-semcache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semcache}
      POSTGRES_DB: ${POSTGRES_DB:-semcache}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semcache}"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-semcache}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-semcache}
      KC_HOSTNAME: http://localhost:8080
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis:/data]

  # ---- profile "app": chạy toàn bộ trong Docker (demo / nộp bài) ----
  backend:
    profiles: ["app"]
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_started }

  frontend:
    profiles: ["app"]
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_KEYCLOAK_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  pgdata:
  qdrant:
  redis:
